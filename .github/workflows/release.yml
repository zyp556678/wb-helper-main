# 发布工作流：一条 tag 打出全部安装包与发行包，并上传到 GitHub Release。
#
# 为什么分三段（前端 / 二进制 / 打包）而不是一个大矩阵：
#   * 前端只需构建一次。放进 6 个平台的矩阵里会重复 6 次 npm ci + vite build，
#     纯浪费（每次约 1 分钟）；
#   * 各平台安装包必须在**对应系统**上打包（deb 要 dpkg-deb、pkg/dmg 要
#     pkgbuild/hdiutil、setup.exe 要 iexpress），所以二进制先行、打包job 再挑平台跑。
#
# 触发：推送 v* tag；也可以在 Actions 页面手动触发（此时不创建 Release，
# 只产出 artifacts，便于上线前试跑）。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 二进制与前端产物之间的传递名，几个 job 保持一致
  ARTIFACT_BIN: wb-binaries
  ARTIFACT_WEB: wb-web-dist

jobs:
  # ---------------------------------------------------------------------------
  # 1) 前端：只构建一次，供各平台矩阵复用
  # ---------------------------------------------------------------------------
  web:
    name: build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_WEB }}
          path: web/dist
          retention-days: 3

  # ---------------------------------------------------------------------------
  # 2) 二进制：六平台交叉编译（纯 Go，无 CGO，不需要目标平台）
  # ---------------------------------------------------------------------------
  binaries:
    name: binaries ${{ matrix.target }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          # 交叉编译本身在哪个 runner 上做都可以，选便宜的 Linux
          - target: linux/amd64
            runs_on: ubuntu-latest
          - target: linux/arm64
            runs_on: ubuntu-latest
          - target: windows/amd64
            runs_on: ubuntu-latest
          - target: windows/arm64
            runs_on: ubuntu-latest
          - target: darwin/amd64
            runs_on: ubuntu-latest
          - target: darwin/arm64
            runs_on: ubuntu-latest
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_WEB }}
          path: web/dist
      - name: Test
        run: go vet ./... && go test ./...
      - name: Package
        run: ./scripts/release.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BIN }}-${{ strategy.job-index }}
          # 每个矩阵 job 只产出自己那个平台的一个 tar.gz / zip
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 3

  # ---------------------------------------------------------------------------
  # 3) 平台安装包（**无窗口**形态：装成服务或命令行，只能开浏览器看面板）
  #
  # 这一组只在手动触发时跑（workflow_dispatch）：
  #   · 它们的产物不再进 Release（Release 只发布带窗口的桌面版，见第 5 节）；
  #   · 打 tag 时跑它们纯属浪费 Actions 分钟，而且 windows-setup 用的 iexpress
  #     实测会空转 20 分钟以上，把整条流水线的状态一直吊在 in_progress。
  # 需要这些包时：Actions 页面 → release → Run workflow。
  # ---------------------------------------------------------------------------
  windows-setup:
    name: windows setup.exe
    needs: binaries
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.ARTIFACT_BIN }}-*
          merge-multiple: true
          path: dist
      # iexpress 是 Windows 自带组件，无需额外安装
      - name: Build setup.exe (x64)
        shell: bash
        run: ./installer/windows/build-setup.sh x64
      - name: Build setup.exe (arm64)
        shell: bash
        run: ./installer/windows/build-setup.sh arm64
      - uses: actions/upload-artifact@v4
        with:
          name: wb-installer-windows
          path: dist/*-setup.exe
          retention-days: 3

  linux-deb:
    name: linux deb
    needs: binaries
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.ARTIFACT_BIN }}-*
          merge-multiple: true
          path: dist
      - name: Build .deb
        run: |
          chmod +x installer/linux/build-deb.sh
          ARCH=amd64 ./installer/linux/build-deb.sh
          ARCH=arm64 ./installer/linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wb-installer-linux
          path: dist/*.deb
          retention-days: 3

  # 桌面版：带原生窗口 + 托盘常驻的 Tauri 壳（与上面那个服务端 deb 是两回事）。
  #
  # 为什么必须单独一个 Linux 作业：Tauri 在 Linux 上要靠系统 WebKitGTK **编译**，
  # 这是 Go 交叉编译覆盖不到的 —— 缺 dev 包就在链接期报一堆 pkg-config 找不到。
  #
  # 为什么只依赖 binaries、不要 web：面板是**网关内嵌**的（go:embed），壳自带启动页，
  # 所以桌面壳本身不消费 web/dist，那个产物在 binaries 作业里已经被烙进网关二进制了。
  linux-desktop-deb:
    name: linux desktop deb
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 注意是 **-dev** 包：编译期要头文件与 pkg-config 描述文件，运行时包不够用。
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Rust 也装进仓库内的 .toolchain/（与本地口径一致），并把工具链与增量产物缓存起来：
      # 首轮要编译约 400 个 crate，没有缓存的话每个 tag 都得从头再来一遍。
      - name: Cache Rust toolchain and target dir
        uses: actions/cache@v4
        with:
          path: |
            .toolchain/rust
            .toolchain/cargo
            .toolchain/cargo-target
          key: rust-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install Rust into .toolchain
        run: |
          export RUSTUP_HOME="$PWD/.toolchain/rust"
          export CARGO_HOME="$PWD/.toolchain/cargo"
          if [ ! -x "$CARGO_HOME/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable
          fi
          "$CARGO_HOME/bin/cargo" --version

      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.ARTIFACT_BIN }}-*
          merge-multiple: true
          path: dist

      # build-desktop-deb.sh 从 dist/linux_<arch>/ 取壳要代管的两个 Go 产物，
      # 而 artifacts 里是压缩包 —— 先解开成它期望的目录结构。
      - name: Unpack linux binaries
        run: tar -xzf dist/workbuddy-gateway_*_linux_amd64.tar.gz -C dist

      - name: Build .deb
        run: ./installer/linux/build-desktop-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wb-installer-linux-desktop
          path: dist/workbuddy-gateway-desktop_*.deb
          retention-days: 3

  # ---------------------------------------------------------------------------
  # 3b) 桌面版：另外两个平台（Linux 那个见上面）
  #
  # 这三个作业产出的才是 Release 发布的东西。它们与第 3 节那组的区别不只是图标：
  # 桌面壳是 Tauri 应用，三个平台各绑一套完全不同的 WebView（WebKitGTK / WKWebView /
  # WebView2），**必须各平台本地编译**，Go 的交叉编译在这里帮不上忙。
  # 三个作业都只依赖 binaries，互不阻塞 —— 任何一个失败都不会拖住另外两个。
  # ---------------------------------------------------------------------------
  macos-desktop-dmg:
    name: macos desktop dmg
    needs: binaries
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 与 Linux 那个作业同一套口径：Rust 装进仓库内的 .toolchain/ 并缓存。
      # macos-14 是 arm64 runner，rustup 的默认 host 就是 aarch64-apple-darwin，
      # 所以只出 arm64 的 dmg（Intel Mac 需要额外加 x86_64 target，见 README 的说明）。
      - name: Cache Rust toolchain and target dir
        uses: actions/cache@v4
        with:
          path: |
            .toolchain/rust
            .toolchain/cargo
            .toolchain/cargo-target
          key: rust-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install Rust into .toolchain
        run: |
          export RUSTUP_HOME="$PWD/.toolchain/rust"
          export CARGO_HOME="$PWD/.toolchain/cargo"
          if [ ! -x "$CARGO_HOME/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable
          fi
          "$CARGO_HOME/bin/cargo" --version

      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.ARTIFACT_BIN }}-*
          merge-multiple: true
          path: dist

      # 打包脚本从 dist/darwin_<arch>/ 取壳要代管的两个 Go 产物。
      - name: Unpack darwin binaries
        run: tar -xzf dist/workbuddy-gateway_*_darwin_arm64.tar.gz -C dist

      - name: Build .dmg
        run: ./installer/macos/build-desktop-pkg.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wb-installer-macos-desktop
          path: dist/workbuddy-gateway-desktop_*.dmg
          retention-days: 3

  windows-desktop-setup:
    name: windows desktop setup.exe
    needs: binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 走 MSVC：GitHub 的 windows runner 自带 VS Build Tools。作者本机之所以绕道
      # windows-gnu，是因为其网络下 aka.ms（VS Build Tools 引导器）不可达 ——
      # 那是本机网络问题，runner 上不存在。打包脚本里另有关于 WebView2Loader.dll
      # 在这两条路上差异的说明。
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.ARTIFACT_BIN }}-*
          merge-multiple: true
          path: dist

      - name: Unpack windows binaries
        shell: bash
        run: tar -xzf dist/workbuddy-gateway_*_windows_amd64.tar.gz -C dist

      - name: Build setup.exe
        shell: bash
        run: ./installer/windows/build-desktop-setup.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wb-installer-windows-desktop
          path: dist/workbuddy-gateway-desktop_*-setup.exe
          retention-days: 3

  macos-pkg:
    name: macos pkg + dmg
    needs: binaries
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.ARTIFACT_BIN }}-*
          merge-multiple: true
          path: dist
      - name: Build .pkg and .dmg
        run: |
          chmod +x installer/macos/build-pkg.sh
          ARCH=arm64 ./installer/macos/build-pkg.sh
          ARCH=amd64 ./installer/macos/build-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wb-installer-macos
          path: |
            dist/*.pkg
            dist/*.dmg
          retention-days: 3

  # ---------------------------------------------------------------------------
  # 4) npm 包：主包 + 各平台二进制包
  # ---------------------------------------------------------------------------
  npm:
    name: npm packages
    needs: binaries
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.ARTIFACT_BIN }}-*
          merge-multiple: true
          path: dist
      - name: Fill platform packages and pack
        run: |
          chmod +x npm/scripts/build-packages.sh
          ./npm/scripts/build-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wb-npm-tarballs
          path: npm/dist/*.tgz
          retention-days: 3
      # 只在前述产物都成功后发布；NPM_TOKEN 未配置时跳过（不阻断 Release）
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN not configured - skipping npm publish."
            echo "The packed tarballs are attached to the Release instead."
            exit 0
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc
          # 先发平台包再发主包：主包的 optionalDependencies 指向它们，
          # 顺序反了会让先装的用户因为"找不到平台包"而拿不到二进制。
          for pkg in $(ls -d npm/platform/*/); do
            [ -n "$(ls -A "$pkg/bin" 2>/dev/null || true)" ] || continue
            npm publish "$pkg" --access public
          done
          npm publish npm --access public

  # ---------------------------------------------------------------------------
  # 5) 汇总到 Release：只发布**桌面版**（带原生窗口 + 托盘），三个平台各一个包
  #
  # 为什么把第 3 节那组排除在 Release 之外：Windows setup.exe / Linux 服务端 deb /
  # macOS pkg+dmg / npm 包全是**无窗口**形态（装成服务或命令行，只能开浏览器看面板）。
  # 两种形态混在同一页附件里，用户很容易装错，而「装完没有窗口」正是最常见的误解。
  # 要无窗口形态的走 DEPLOY.md 里的那几条路。
  #
  # 三个桌面作业互不阻塞，但这里的 needs 要求三个都成功才发布 —— 宁可暂时不发，
  # 也不要发出一个"看着齐、其实少一个平台"的 Release。缺哪个就看那个作业的日志。
  # ---------------------------------------------------------------------------
  release:
    name: publish release
    needs: [linux-desktop-deb, macos-desktop-dmg, windows-desktop-setup]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 三个桌面作业的 artifacts 命名统一是 wb-installer-<os>-desktop，一次取齐。
      - uses: actions/download-artifact@v4
        with:
          pattern: wb-installer-*-desktop
          merge-multiple: true
          path: dist
      - name: List assets
        run: ls -lh dist
      # 版本号从源码里解析，而不是在正文里写死：否则每次发版都得记着改模板，
      # 忘了就会出现「附件文件名是 0.9.0、说明里写着 0.8.0」这种自相矛盾的一页。
      - name: Resolve versions
        id: ver
        run: |
          DESKTOP=$(sed -n 's/.*"version": "\([^"]*\)".*/\1/p' desktop/src-tauri/tauri.conf.json | head -1)
          GATEWAY=$(sed -n 's/^const version = "\(.*\)"/\1/p' main.go | head -1)
          if [ -z "$DESKTOP" ] || [ -z "$GATEWAY" ]; then
            echo "!! 未能从 tauri.conf.json / main.go 解析出版本号" >&2
            exit 1
          fi
          echo "desktop=$DESKTOP" >> "$GITHUB_OUTPUT"
          echo "gateway=$GATEWAY" >> "$GITHUB_OUTPUT"
          echo "壳版本 $DESKTOP / 内含网关版本 $GATEWAY"
      - uses: softprops/action-gh-release@v2
        with:
          # 标题也带上版本号，避免 Release 列表里一排「桌面版」分不出哪个是哪个。
          name: 桌面版 ${{ steps.ver.outputs.desktop }} · Windows / macOS / Linux（原生窗口 + 托盘）
          # 未找到 tag 对应的 Release 时自动创建，已存在则覆盖同名资产
          #
          # 逐平台写 glob 而不是 dist/*：这个目录里只该有三种桌面版包，
          # 万一以后有人往 dist/ 里加了别的产物，也不该被顺手发到这个 Release 上。
          files: |
            dist/workbuddy-gateway-desktop_*.deb
            dist/workbuddy-gateway-desktop_*.dmg
            dist/workbuddy-gateway-desktop_*-setup.exe
          generate_release_notes: true
          body: |
            ## WorkBuddy 网关 · 桌面版 ${{ steps.ver.outputs.desktop }}

            原生窗口 + 托盘常驻的桌面应用。窗口里承载的就是那套 React 管理面板 ——
            与命令行版、浏览器版是**同一份界面、同一份账号池**；壳只负责代管 Go 网关
            进程，并在它就绪后把窗口切到面板。

            ### 下载

            | 平台 | 文件 |
            | --- | --- |
            | Linux x86_64 | `workbuddy-gateway-desktop_${{ steps.ver.outputs.desktop }}_amd64.deb` |
            | macOS（Apple Silicon） | `workbuddy-gateway-desktop_${{ steps.ver.outputs.desktop }}_arm64.dmg` |
            | Windows x64 | `workbuddy-gateway-desktop_${{ steps.ver.outputs.desktop }}_x64-setup.exe` |

            三个包内嵌的网关版本都是 `${{ steps.ver.outputs.gateway }}`。

            ### 安装

            **Linux** —— 需要 WebKitGTK 4.1（Ubuntu 24.04 及以上自带）

            ```bash
            sudo dpkg -i workbuddy-gateway-desktop_${{ steps.ver.outputs.desktop }}_amd64.deb
            # 若提示缺依赖： sudo apt -f install
            ```

            装完在应用菜单里找「WorkBuddy Gateway」，或运行 `workbuddy-gateway-desktop`。

            > GNOME 下托盘图标依赖 AppIndicator 扩展（Ubuntu 默认已启用
            > `ubuntu-appindicators`）。没有该扩展时窗口一切正常，只是没有托盘图标 ——
            > 此时点关闭会把界面收进托盘却无处可点，只能从命令行结束进程。

            **macOS** —— 需要 macOS 10.15+

            打开 `.dmg`，把「WorkBuddy Gateway」拖进「应用程序」。首次打开会被 Gatekeeper
            拦下（未签名），右键 →「打开」即可。

            **Windows** —— 需要 WebView2 运行时（Windows 11 自带）

            双击运行，每用户安装、免 UAC，装完从开始菜单启动。

            ### 首次运行

            1. 窗口先显示启动页：壳在后台拉起网关并等它就绪。冷启动要读配置、拉模型目录，
               几秒到几十秒不等，属预期行为。
            2. 就绪后自动切到管理面板。此时**账号池还是空的** —— 点面板里的「添加账号」
               完成登录授权，或把 `workbuddy*.json` 放进数据目录。
            3. 之后 CLI / IDE 就能把 `http://127.0.0.1:8317/v1` 当作 OpenAI 兼容端点调用
               （端口与命令行版一致，写好的配置不用改）。

            ### 日常操作

            | 想做什么 | 怎么做 |
            | --- | --- |
            | 关掉界面但让网关继续常驻 | 直接关窗口（收进托盘） |
            | 真正退出应用 | 托盘菜单 →「退出」 |
            | 开机自启 | 托盘菜单，或面板「配置 → 开机自启动」（默认**关**；开启后**静默启动**，只驻托盘不弹窗） |
            | 检查新版本 | 面板「配置 → 检查更新」（默认每 6 小时后台查一次；发现新版本可一键下载安装包） |
            | 看后台日志 | 数据目录下的 `logs/gateway.log` |
            | 数据与凭据目录 | Linux / macOS：`~/.wb-gateway`；Windows：`%LOCALAPPDATA%\wb-gateway` |

            > 本桌面版与命令行安装包**共用 8317 端口**，所以只能给其中一个设置开机自启，
            > 否则登录时两个进程会抢同一个端口（表现为「有时能连上、有时连不上」）。
            >
            > 「检查更新」查的是本仓库的 Release（私有仓库需要配只读令牌，见 README）；
            > 它只负责**查到并下载安装包**，不会自行替换正在运行的程序 ——
            > 装哪一份、什么时候装由你决定。

            ### 怎么确认这个包是从本提交构建的

            三个附件都由 GitHub Actions 在**对应的真实操作系统**上构建（Linux / macOS /
            Windows runner），可自行读出包内二进制的构建信息核对：

            ```bash
            # 以 Linux 的 deb 为例
            dpkg-deb -x workbuddy-gateway-desktop_${{ steps.ver.outputs.desktop }}_amd64.deb /tmp/d
            strings "/tmp/d/usr/lib/WorkBuddy Gateway/bin/workbuddy-gateway" \
              | grep -E 'vcs\.(revision|modified)'
            # vcs.revision 应等于本页 tag 指向的提交；vcs.modified 应为 false
            ```

            ### 需要「无窗口」形态？

            本仓库另有几条安装路径，**不在本页附件里**（两种形态混在一页容易装错）：

            - 装成 systemd 服务、只开浏览器看面板：`installer/linux/build-deb.sh`
            - 免安装压缩包：解压后 `./workbuddy-gateway serve`
            - npm 全局安装：`npm i -g workbuddy-gateway`

            具体步骤见仓库里的 `DEPLOY.md`。

            ### 已知限制

            - 安装包**未做代码签名**（Windows SmartScreen 与 macOS Gatekeeper 会提示）。
            - macOS 目前只有 Apple Silicon（arm64）。Intel Mac 需要额外补
              `x86_64-apple-darwin` 目标，见 `installer/macos/build-desktop-pkg.sh`。
            - 本项目是非官方网关，使用上游账号涉及目标平台服务条款与封号风险，
              仅限本人授权账号与私有环境使用。
