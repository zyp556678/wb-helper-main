# 发布工作流：一条 tag 打出全部安装包与发行包，并上传到 GitHub Release。
#
# 为什么分三段（前端 / 二进制 / 打包）而不是一个大矩阵：
#   * 前端只需构建一次。放进 6 个平台的矩阵里会重复 6 次 npm ci + vite build，
#     纯浪费（每次约 1 分钟）；
#   * 各平台安装包必须在**对应系统**上打包（deb 要 dpkg-deb、pkg/dmg 要
#     pkgbuild/hdiutil、setup.exe 要 iexpress），所以二进制先行、打包job 再挑平台跑。
#
# 触发：推送 v* tag；也可以在 Actions 页面手动触发（此时不创建 Release，
# 只产出 artifacts，便于上线前试跑）。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  # 二进制与前端产物之间的传递名，几个 job 保持一致
  ARTIFACT_BIN: wb-binaries
  ARTIFACT_WEB: wb-web-dist

jobs:
  # ---------------------------------------------------------------------------
  # 1) 前端：只构建一次，供各平台矩阵复用
  # ---------------------------------------------------------------------------
  web:
    name: build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_WEB }}
          path: web/dist
          retention-days: 3

  # ---------------------------------------------------------------------------
  # 2) 二进制：六平台交叉编译（纯 Go，无 CGO，不需要目标平台）
  # ---------------------------------------------------------------------------
  binaries:
    name: binaries ${{ matrix.target }}
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          # 交叉编译本身在哪个 runner 上做都可以，选便宜的 Linux
          - target: linux/amd64
            runs_on: ubuntu-latest
          - target: linux/arm64
            runs_on: ubuntu-latest
          - target: windows/amd64
            runs_on: ubuntu-latest
          - target: windows/arm64
            runs_on: ubuntu-latest
          - target: darwin/amd64
            runs_on: ubuntu-latest
          - target: darwin/arm64
            runs_on: ubuntu-latest
    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_WEB }}
          path: web/dist
      - name: Test
        run: go vet ./... && go test ./...
      - name: Package
        run: ./scripts/release.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BIN }}-${{ strategy.job-index }}
          # 每个矩阵 job 只产出自己那个平台的一个 tar.gz / zip
          path: |
            dist/*.tar.gz
            dist/*.zip
          retention-days: 3

  # ---------------------------------------------------------------------------
  # 3) 平台安装包
  # ---------------------------------------------------------------------------
  windows-setup:
    name: windows setup.exe
    needs: binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.ARTIFACT_BIN }}-*
          merge-multiple: true
          path: dist
      # iexpress 是 Windows 自带组件，无需额外安装
      - name: Build setup.exe (x64)
        shell: bash
        run: ./installer/windows/build-setup.sh x64
      - name: Build setup.exe (arm64)
        shell: bash
        run: ./installer/windows/build-setup.sh arm64
      - uses: actions/upload-artifact@v4
        with:
          name: wb-installer-windows
          path: dist/*-setup.exe
          retention-days: 3

  linux-deb:
    name: linux deb
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.ARTIFACT_BIN }}-*
          merge-multiple: true
          path: dist
      - name: Build .deb
        run: |
          chmod +x installer/linux/build-deb.sh
          ARCH=amd64 ./installer/linux/build-deb.sh
          ARCH=arm64 ./installer/linux/build-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wb-installer-linux
          path: dist/*.deb
          retention-days: 3

  # 桌面版：带原生窗口 + 托盘常驻的 Tauri 壳（与上面那个服务端 deb 是两回事）。
  #
  # 为什么必须单独一个 Linux 作业：Tauri 在 Linux 上要靠系统 WebKitGTK **编译**，
  # 这是 Go 交叉编译覆盖不到的 —— 缺 dev 包就在链接期报一堆 pkg-config 找不到。
  #
  # 为什么只依赖 binaries、不要 web：面板是**网关内嵌**的（go:embed），壳自带启动页，
  # 所以桌面壳本身不消费 web/dist，那个产物在 binaries 作业里已经被烙进网关二进制了。
  linux-desktop-deb:
    name: linux desktop deb
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 注意是 **-dev** 包：编译期要头文件与 pkg-config 描述文件，运行时包不够用。
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Rust 也装进仓库内的 .toolchain/（与本地口径一致），并把工具链与增量产物缓存起来：
      # 首轮要编译约 400 个 crate，没有缓存的话每个 tag 都得从头再来一遍。
      - name: Cache Rust toolchain and target dir
        uses: actions/cache@v4
        with:
          path: |
            .toolchain/rust
            .toolchain/cargo
            .toolchain/cargo-target
          key: rust-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install Rust into .toolchain
        run: |
          export RUSTUP_HOME="$PWD/.toolchain/rust"
          export CARGO_HOME="$PWD/.toolchain/cargo"
          if [ ! -x "$CARGO_HOME/bin/cargo" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --no-modify-path --profile minimal --default-toolchain stable
          fi
          "$CARGO_HOME/bin/cargo" --version

      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.ARTIFACT_BIN }}-*
          merge-multiple: true
          path: dist

      # build-desktop-deb.sh 从 dist/linux_<arch>/ 取壳要代管的两个 Go 产物，
      # 而 artifacts 里是压缩包 —— 先解开成它期望的目录结构。
      - name: Unpack linux binaries
        run: tar -xzf dist/workbuddy-gateway_*_linux_amd64.tar.gz -C dist

      - name: Build .deb
        run: ./installer/linux/build-desktop-deb.sh

      - uses: actions/upload-artifact@v4
        with:
          name: wb-installer-linux-desktop
          path: dist/workbuddy-gateway-desktop_*.deb
          retention-days: 3

  macos-pkg:
    name: macos pkg + dmg
    needs: binaries
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.ARTIFACT_BIN }}-*
          merge-multiple: true
          path: dist
      - name: Build .pkg and .dmg
        run: |
          chmod +x installer/macos/build-pkg.sh
          ARCH=arm64 ./installer/macos/build-pkg.sh
          ARCH=amd64 ./installer/macos/build-pkg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wb-installer-macos
          path: |
            dist/*.pkg
            dist/*.dmg
          retention-days: 3

  # ---------------------------------------------------------------------------
  # 4) npm 包：主包 + 各平台二进制包
  # ---------------------------------------------------------------------------
  npm:
    name: npm packages
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.ARTIFACT_BIN }}-*
          merge-multiple: true
          path: dist
      - name: Fill platform packages and pack
        run: |
          chmod +x npm/scripts/build-packages.sh
          ./npm/scripts/build-packages.sh
      - uses: actions/upload-artifact@v4
        with:
          name: wb-npm-tarballs
          path: npm/dist/*.tgz
          retention-days: 3
      # 只在前述产物都成功后发布；NPM_TOKEN 未配置时跳过（不阻断 Release）
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "NPM_TOKEN not configured - skipping npm publish."
            echo "The packed tarballs are attached to the Release instead."
            exit 0
          fi
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" > ~/.npmrc
          # 先发平台包再发主包：主包的 optionalDependencies 指向它们，
          # 顺序反了会让先装的用户因为"找不到平台包"而拿不到二进制。
          for pkg in $(ls -d npm/platform/*/); do
            [ -n "$(ls -A "$pkg/bin" 2>/dev/null || true)" ] || continue
            npm publish "$pkg" --access public
          done
          npm publish npm --access public

  # ---------------------------------------------------------------------------
  # 5) 汇总到 Release
  #
  # 只发布**桌面版**（带原生窗口 + 托盘的那个包）。
  #
  # 为什么把其它产物排除在 Release 之外：本工作流另外还产出 Windows setup.exe、
  # Linux 服务端 deb、macOS pkg/dmg、npm 包 —— 它们全是**无窗口**形态（装成服务或
  # 命令行，只能开浏览器看面板）。把两种形态混在同一页附件里，用户很容易装错，
  # 而"装完没有窗口"正是最常见的误解。要无窗口形态的走 DEPLOY.md 里的那几条路。
  #
  # 这些产物仍然照常构建并上传为本次运行的 artifacts，需要时从 Actions 页面取；
  # 它们不再作为 Release 的依赖，所以任何一个失败也不会再挡住桌面版的发布。
  # ---------------------------------------------------------------------------
  release:
    name: publish release
    needs: [linux-desktop-deb]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wb-installer-linux-desktop
          path: dist
      - name: List assets
        run: ls -lh dist
      - uses: softprops/action-gh-release@v2
        with:
          # 未找到 tag 对应的 Release 时自动创建，已存在则覆盖同名资产
          #
          # 用带前缀的 glob 而不是 dist/*：这个目录里只该有桌面版那个 deb，
          # 万一以后有人往 dist/ 里加了别的产物，也不该被顺手发到这个 Release 上。
          files: dist/workbuddy-gateway-desktop_*.deb
          generate_release_notes: true
          body: |
            ## 本页附件

            | 平台 | 文件 | 形态 |
            | --- | --- | --- |
            | Linux x86_64 | `workbuddy-gateway-desktop_<版本>_amd64.deb` | **桌面版**：原生窗口 + 托盘常驻的 Tauri 壳 |

            ```
            sudo dpkg -i workbuddy-gateway-desktop_<版本>_amd64.deb
            # 若提示缺依赖： sudo apt -f install
            ```

            装完在应用菜单里找「WorkBuddy Gateway」，或直接运行 `workbuddy-gateway-desktop`。
            关闭窗口是收进托盘（网关继续常驻），真正的退出走托盘菜单的「退出」。
            数据目录 `~/.wb-gateway`，日志 `~/.wb-gateway/logs/gateway.log`。
            首次启动会先拉取模型目录，就绪后面板自动加载，属预期行为。

            > GNOME 下托盘图标依赖 AppIndicator 扩展（Ubuntu 默认已启用
            > `ubuntu-appindicators`）。没有该扩展时窗口一切正常，只是没有托盘图标 ——
            > 此时点关闭会把界面收进托盘却无处可点。

            ## 需要「无窗口」形态的话

            本仓库另有几条安装路径，**不在本页附件里**（两种形态混在一页容易装错）：

            - 装成 systemd 服务、只开浏览器看面板：`installer/linux/build-deb.sh`
            - 免安装压缩包：解压后 `./workbuddy-gateway serve`
            - npm 全局安装：`npm i -g workbuddy-gateway`

            具体步骤见仓库里的 `DEPLOY.md`。

            ## 说明

            - 安装包**未做代码签名**。
            - 账号凭据请通过面板的「添加账号」获取，或把 `workbuddy*.json` 放进数据目录。
            - 本项目是非官方网关，使用上游账号涉及目标平台服务条款与封号风险，
              仅限本人授权账号与私有环境使用。
