<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>WorkBuddy 网关 · 控制台</title>
    <!--
      内联 SVG 图标：不额外产出文件、也不依赖服务端有 /favicon.ico 路由。
      之前没有它，浏览器会去请求根路径的 favicon 并拿到 404，在控制台留下噪音，
      排查真实错误时容易干扰判断。
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='15' fill='%2310ac96'/><path d='M17 32h22M33 22l10 10-10 10' fill='none' stroke='white' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/></svg>"
    />
    <!--
      首屏兜底样式：纯内联，跟随系统主题上色，避免深色模式下挂载前闪白。
      React 挂载后清空 #root，占位自然消失。

      **只设 background，不设 color** —— 这一段不在 @layer 里，而未分层样式
      永远压过 Tailwind 的 @layer base。此处一旦写 color，无论写成系统深色值
      还是浅色值，都会盖掉挂载后 body 上的 text-foreground：面板主题是**用户选的**
      （默认跟随系统，但可以手动切），与内联样式看的 prefers-color-scheme 是两个来源，
      二者相反时（系统深色 + 面板浅色）标题等「继承 body 颜色」的文字就会变成
      对白底几乎不可见的浅灰，而副标题、卡片这些**显式**用令牌的元素看着正常 ——
      症状是「每页只有主标题淡了」，极难联想到首屏兜底样式。
      文字颜色交给令牌；首屏那一瞬间的 body 颜色由 .wb-boot 自己指定。
    -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }
      .wb-boot {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        color: #6b7280;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1e293b;
        }
        .wb-boot {
          color: #9aa4b8;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="wb-boot">正在加载控制台…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
